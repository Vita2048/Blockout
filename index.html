<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOCK OUT - Retro 3D Tetris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD Container */
        #hud {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        /* Right sidebar */
        #rightPanel {
            position: absolute;
            right: 20px;
            top: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: 200px;
        }

        .logo-container {
            margin-bottom: 30px;
            text-align: center;
            transform: skewX(-10deg);
            /* Slight retro skew */
        }

        .logo-text {
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-size: 48px;
            line-height: 0.8;
            text-transform: uppercase;
        }

        .logo-text.blue-red {
            color: #0022ff;
            /* Complex shadow for outline effect */
            text-shadow:
                -2px -2px 0 #ff0000,
                2px -2px 0 #ff0000,
                -2px 2px 0 #ff0000,
                2px 2px 0 #ff0000,
                4px 4px 0 #000;
        }

        .hudGroup {
            margin-bottom: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .hudLabel {
            color: #0088ff;
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
        }

        .hudValue {
            color: #0f0;
            /* Green text */
            font-size: 22px;
            font-weight: bold;
            border: 3px solid #0000ff;
            /* Blue border */
            background-color: #000;
            padding: 5px 10px;
            text-align: right;
            width: 100%;
            box-shadow: 0 0 10px rgba(0, 0, 255, 0.5), inset 0 0 10px rgba(0, 0, 255, 0.3);
            font-family: 'Courier New', monospace;
        }

        /* Left sidebar */
        #leftPanel {
            position: absolute;
            left: 30px;
            top: 100px;
            text-align: left;
            line-height: 2;
        }

        #levelLabel {
            color: #00f;
            font-size: 14px;
            letter-spacing: 1px;
        }

        #levelValue {
            color: #ff0;
            font-size: 24px;
            font-weight: bold;
            margin-left: 10px;
        }

        /* Depth Bar (Layer Indicator) */
        #depthBar {
            position: absolute;
            left: 50px;
            bottom: 50px;
            width: 40px;
            height: 400px;
            border: 4px solid #0000aa;
            /* Dark blue border */
            background-color: #000;
            display: flex;
            flex-direction: column-reverse;
            /* Bottom is index 0 */
            padding: 2px;
        }

        .depth-layer {
            width: 100%;
            flex: 1;
            /* Distribute height equally */
            border-top: 1px solid #333;
            box-sizing: border-box;
            background-color: transparent;
            transition: background-color 0.2s;
        }

        .depth-layer.filled {
            /* Color will be set inline */
        }

        /* Screen Border to mimic original */
        body::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 4px solid #0000aa;
            pointer-events: none;
            z-index: 50;
        }

        /* Game Over screen    <style>*/
        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            padding: 40px;
            background-color: rgba(0, 0, 0, 0.9);
            border: 4px solid #00f;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 0, 255, 0.5), inset 0 0 20px rgba(0, 0, 255, 0.2);
            display: flex;
            /* Visible by default */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            pointer-events: auto;
        }

        #startScreen h1 {
            font-size: 64px;
            color: #00f;
            text-shadow: 0 0 10px #00f, 4px 4px 0 #f00;
            margin-bottom: 10px;
            letter-spacing: 5px;
            font-family: 'Courier New', monospace;
        }

        #startScreen h2 {
            font-size: 24px;
            color: #0f0;
            margin-bottom: 30px;
            text-shadow: 0 0 5px #0f0;
            letter-spacing: 2px;
        }

        .difficulty-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            align-items: center;
        }

        .difficulty-buttons button {
            padding: 15px 0;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            background-color: #000;
            color: #0ff;
            /* Cyan text */
            border: 2px solid #0ff;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            width: 80%;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        .difficulty-buttons button:hover {
            background-color: #0ff;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            transform: scale(1.05);
        }

        /* Game Over screen */
        #gameOverScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: all;
            z-index: 100;
        }

        #gameOverScreen.show {
            display: flex;
        }

        #gameOverText {
            font-size: 48px;
            color: #f00;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0 #0f0;
            letter-spacing: 2px;
        }

        #finalScore {
            font-size: 24px;
            color: #ff0;
            margin-bottom: 40px;
        }

        #restartButton {
            font-size: 20px;
            padding: 15px 40px;
            background-color: #0f0;
            color: #000;
            border: 3px solid #00f;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.2s;
            pointer-events: all;
        }

        #restartButton:hover {
            background-color: #00f;
            color: #0f0;
            border-color: #0f0;
        }

        /* Control instructions */
        #controls {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 12px;
            color: #0f0;
            line-height: 1.4;
            text-align: right;
            opacity: 0.7;
        }

        /* Pause indicator */
        #pauseIndicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: #0f0;
            text-shadow: 2px 2px 0 #f00;
            display: none;
            pointer-events: none;
        }

        #pauseIndicator.show {
            display: block;
        }
    </style>
</head>

<body>
    <div id="hud">
        <!-- Center Title Removed, moving to Right Panel -->

        <div id="leftPanel">
            <div id="levelLabel">LEVEL</div>
            <div id="levelValue">1</div>
        </div>

        <div id="depthBar"></div>

        <div id="rightPanel">
            <div class="logo-container">
                <div class="logo-text blue-red">BLOCK</div>
                <div class="logo-text blue-red">OUT</div>
            </div>

            <div class="hudGroup">
                <div class="hudLabel">SCORE</div>
                <div class="hudValue" id="scoreValue">0</div>
            </div>

            <div class="hudGroup">
                <div class="hudLabel">CUBES PLAYED</div>
                <div class="hudValue" id="cubesValue">0</div>
            </div>

            <div class="hudGroup">
                <div class="hudLabel">HIGH SCORE</div>
                <div class="hudValue" id="highScoreValue">0</div>
            </div>


            <div class="hudGroup">
                <div class="hudLabel">BLOCK SET</div>
                <div class="hudValue" id="blockSet">BASIC</div>
            </div>
        </div>

        <div id="controls">
            ↑/↓/←/→: Move<br>
            A/S/D or Q/W/E: Rotate X/Y/Z<br>
            SPACE: Drop<br>
            P: Pause | Esc: Menu
        </div>

        <div id="pauseIndicator">PAUSED</div>
    </div>

    <div id="startScreen">
        <h1>BLOCK OUT</h1>
        <h2>SELECT DIFFICULTY</h2>
        <div class="difficulty-buttons">
            <button onclick="startGame(1)">LEVEL 1 (Slow)</button>
            <button onclick="startGame(2)">LEVEL 2 (Normal)</button>
            <button onclick="startGame(3)">LEVEL 3 (Fast)</button>
            <button onclick="startGame(4)">LEVEL 4 (Turbo)</button>
            <button onclick="startGame(5)">LEVEL 5 (Extreme)</button>
        </div>
    </div>

    <div id="gameOverScreen">
        <div id="gameOverText">GAME OVER</div>
        <div id="finalScore">FINAL SCORE: <span id="finalScoreValue">0</span></div>
        <button id="restartButton">PLAY AGAIN</button>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/lines/LineSegmentsGeometry.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/lines/LineMaterial.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/lines/LineSegments2.js"></script>

    <!-- Game script -->
    <script src="game.js"></script>
</body>

</html>
