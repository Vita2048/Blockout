<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOCK OUT - Retro 3D Tetris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD Container */
        #hud {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        /* Title */
        #title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            color: #f00;
            text-shadow: 2px 2px 0 #0f0;
            letter-spacing: 3px;
        }

        /* Right sidebar */
        #rightPanel {
            position: absolute;
            right: 30px;
            top: 100px;
            text-align: left;
            line-height: 1.8;
            color: #0f0;
        }

        .hudLabel {
            color: #00f;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .hudValue {
            color: #ff0;
            font-size: 18px;
            margin-left: 20px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Left sidebar */
        #leftPanel {
            position: absolute;
            left: 30px;
            top: 100px;
            text-align: left;
            line-height: 2;
        }

        #levelLabel {
            color: #00f;
            font-size: 14px;
            letter-spacing: 1px;
        }

        #levelValue {
            color: #ff0;
            font-size: 24px;
            font-weight: bold;
            margin-left: 10px;
        }

        /* Color bar decoration */
        #colorBar {
            position: absolute;
            left: 30px;
            bottom: 50px;
            width: 20px;
            height: 150px;
            border: 2px solid #0f0;
            background: linear-gradient(180deg, #0f0 0%, #00f 33%, #f0f 66%, #f00 100%);
        }

        /* Game Over screen */
        #gameOverScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: all;
            z-index: 100;
        }

        #gameOverScreen.show {
            display: flex;
        }

        #gameOverText {
            font-size: 48px;
            color: #f00;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0 #0f0;
            letter-spacing: 2px;
        }

        #finalScore {
            font-size: 24px;
            color: #ff0;
            margin-bottom: 40px;
        }

        #restartButton {
            font-size: 20px;
            padding: 15px 40px;
            background-color: #0f0;
            color: #000;
            border: 3px solid #00f;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.2s;
            pointer-events: all;
        }

        #restartButton:hover {
            background-color: #00f;
            color: #0f0;
            border-color: #0f0;
        }

        /* Control instructions */
        #controls {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 12px;
            color: #0f0;
            line-height: 1.4;
            text-align: right;
            opacity: 0.7;
        }

        /* Pause indicator */
        #pauseIndicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: #0f0;
            text-shadow: 2px 2px 0 #f00;
            display: none;
            pointer-events: none;
        }

        #pauseIndicator.show {
            display: block;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div id="title">BLOCK OUT</div>
        
        <div id="leftPanel">
            <div id="levelLabel">LEVEL</div>
            <div id="levelValue">1</div>
        </div>

        <div id="rightPanel">
            <div class="hudLabel">SCORE</div>
            <div class="hudValue" id="scoreValue">0</div>
            
            <div class="hudLabel">CUBES PLAYED</div>
            <div class="hudValue" id="cubesValue">0</div>
            
            <div class="hudLabel">HIGH SCORE</div>
            <div class="hudValue" id="highScoreValue">0</div>
            
            <div class="hudLabel">PIT SIZE</div>
            <div class="hudValue" id="pitSize">5x5x10</div>
            
            <div class="hudLabel">BLOCK SET</div>
            <div class="hudValue" id="blockSet">BASIC</div>
        </div>

        <div id="colorBar"></div>

        <div id="controls">
            ↑/↓/←/→: Move<br>
            Q/W/E: Rotate X/Y/Z<br>
            SPACE: Drop<br>
            P: Pause | R: Restart
        </div>

        <div id="pauseIndicator">PAUSED</div>
    </div>

    <div id="gameOverScreen">
        <div id="gameOverText">GAME OVER</div>
        <div id="finalScore">FINAL SCORE: <span id="finalScoreValue">0</span></div>
        <button id="restartButton">PLAY AGAIN</button>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Game script -->
    <script src="game.js"></script>
</body>
</html>
